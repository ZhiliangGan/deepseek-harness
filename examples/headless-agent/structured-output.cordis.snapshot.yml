# Replay counterpart to structured-output.cordis.yml. It includes cordis.yml
# directly because a config patch cannot target an entry behind a nested
# include, then restates the structured-output overlay while replacing the
# live model with keyless replay (an override-only script; no recorded session
# fixture is needed).
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: structured-output
            name: '@deepseek-ai/dsh-structured-output'
            config:
              maxRetries: 1
              schema:
                type: object
                required: [status, summary]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [ok, error]
                  summary:
                    type: string
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
